<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(120deg, #4facfe, #00f2fe);
        }

        .container{
            background:white;
            padding:40px 60px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
            animation:fadeIn 1.2s ease-in-out;
        }

        h1{
            font-size:40px;
            color:#333;
            margin-bottom:10px;
        }

        p{
            font-size:18px;
            color:#666;
            margin-bottom:25px;
        }

        button{
            padding:12px 25px;
            border:none;
            border-radius:30px;
            background:#4facfe;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#00c6ff;
            transform:scale(1.05);
        }

        @keyframes fadeIn{
            from{opacity:0; transform:translateY(30px);} 
            to{opacity:1; transform:translateY(0);} 
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome Rishu 👋</h1>
        <p>Glad to see you here! Start building something amazing today.</p>
        <button onclick="alert('Let\'s Start 🚀')">Get Started</button>
    </div>

</body>
</html>
